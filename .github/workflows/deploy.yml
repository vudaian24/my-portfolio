name: Deploy

# Reusable: SSH vào VPS, trỏ APP_VERSION sang image_tag, health check,
# báo Telegram. Không build gì — image phải đã tồn tại trên Docker Hub
# trước khi gọi workflow này.
#
# Dùng bởi 2 nơi:
#   - cd.yml, ngay sau khi build-and-push xong (deploy tự động mỗi lần
#     push lên main)
#   - main.yml, nhánh workflow_dispatch thủ công với `rollback_tag` — deploy
#     lại một tag CŨ đã có sẵn trên Docker Hub mà KHÔNG build lại, dùng để
#     rollback khi bản mới có vấn đề.
#
# Server quản lý bởi repo vps-manager (ansible/roles/apps). Thư mục
# /opt/stacks/portfolio thuộc group `appdeploy`, setgid — user `ci` dưới
# đây chỉ ở group đó, KHÔNG có sudo, KHÔNG chạm gì ngoài stack này.

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      VPS_HOST:
        required: true
      VPS_SSH_KEY:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Nạp SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          # Host key pin CỨNG (không ssh-keyscan lúc chạy — TOFU từ CI
          # runner có thể bị MITM nếu DNS/mạng giữa runner và VPS bị can
          # thiệp). Giá trị lấy trực tiếp từ VPS ngày 2026-08-17.
          echo "${{ secrets.VPS_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM8dRVzFCyrqScGQF3MbfmkT4crzoy3blyQhLpxmkPPX" > ~/.ssh/known_hosts

      - name: "Deploy ${{ inputs.image_tag }}"
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          # shellcheck disable=SC2087
          # CỐ Ý không quote 'EOF'. TAG phải giãn ở phía RUNNER (biến
          # GitHub Actions, server không biết giá trị này) trước khi nội
          # dung heredoc được gửi qua SSH, không phải giãn ở phía server.
          ssh -i ~/.ssh/id_ci ci@${{ secrets.VPS_HOST }} bash -s <<EOF
          set -euo pipefail
          cd /opt/stacks/portfolio

          # Ghi lại version cũ để rollback thủ công nếu cần đối chiếu
          cp .deployed-version .previous-version 2>/dev/null || true

          sed -i "s|^APP_VERSION=.*|APP_VERSION=${TAG}|" .env

          docker compose pull
          docker compose up -d --wait
          echo "${TAG}" > .deployed-version
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -m 5 https://portfolio.anvd.io.vn >/dev/null; then
              echo "✓ site sống, đang chạy ${{ inputs.image_tag }}"
              exit 0
            fi
            echo "chờ... ($i/12)"; sleep 5
          done
          echo "::error::Health check FAIL sau 60s."
          echo "Rollback: Actions -> Pipeline -> Run workflow -> điền rollback_tag = tag cũ"
          exit 1

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TAG="${{ inputs.image_tag }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            MESSAGE="✅ <b>Deploy succeeded</b>%0A📦 <code>${TAG:0:12}</code>%0A🔗 <a href='${RUN_URL}'>View run</a>"
          else
            MESSAGE="❌ <b>Deploy failed</b>%0A📦 <code>${TAG:0:12}</code>%0A🔗 <a href='${RUN_URL}'>View run</a>"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="$MESSAGE"

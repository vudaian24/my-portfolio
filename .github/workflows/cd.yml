name: CD

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
      # VPS_HOST, VPS_SSH_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID không
      # khai báo ở đây — job `deploy` dưới dùng `secrets: inherit` để
      # chuyển tiếp nguyên trạng ngữ cảnh secret từ caller (main.yml)
      # xuống deploy.yml, không cần cd.yml tự khai báo lại.

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-portfolio:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-portfolio:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # Tách deploy thành workflow riêng (deploy.yml) để dùng lại được cho cả
  # rollback thủ công (main.yml, workflow_dispatch) mà không phải build lại.
  deploy:
    name: Deploy
    needs: build-and-push
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit

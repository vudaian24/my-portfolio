name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: >-
          Rollback: tag image đã có trên Docker Hub (vd: git SHA của lần
          deploy trước). Điền vào đây để deploy LẠI tag cũ, KHÔNG build
          lại. Để trống nếu chỉ muốn chạy CI/CD bình thường.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || inputs.rollback_tag == ''
    uses: ./.github/workflows/ci.yml

  cd:
    needs: ci
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_tag != ''
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ inputs.rollback_tag }}
    secrets: inherit
